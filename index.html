<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演播室时钟</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="loadingScreen">
        <div class="loader"></div>
    </div>

    <!-- 保留此元素用于兼容但不再显示 -->
    <div id="backgroundOverlay"></div>

    <button id="settingsButton">设置</button>

    <div id="settingsPanel">
        <h2>设置</h2>
        <label for="fontSize">时钟字体大小：</label>
        <input type="range" id="fontSize" min="20" max="200" value="70">
        <label for="backgroundImage">背景图片：</label>
        <div id="currentBackgroundImage"></div>
        <div class="background-controls">
            <label for="backgroundImage" class="custom-file-btn">选择图片</label>
            <input type="file" id="backgroundImage" accept="image/*" style="display: none;">
            <button id="removeBackgroundImage" style="display: none;">移除背景</button>
        </div>
        <label for="backgroundMode">背景模式：</label>
        <select id="backgroundMode">
            <option value="cover">自适应浏览器尺寸</option>
            <option value="contain">裁切</option>
            <option value="stretch">拉伸</option>
        </select>
        <label for="blurAmount">背景模糊度：</label>
        <input type="range" id="blurAmount" min="0" max="20" value="0">
        <label for="opacity">背景暗度：</label>
        <input type="range" id="opacity" min="0" max="100" value="0">

        <div class="settings-divider"></div>

        <div class="toggle-setting">
            <label for="glowEffect">时钟发光效果：</label>
            <label class="toggle-switch">
                <input type="checkbox" id="glowEffect" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="toggle-setting">
            <label for="darkMode">演播室深色模式：</label>
            <label class="toggle-switch">
                <input type="checkbox" id="darkMode">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <button id="saveSettings">保存设置</button>
    </div>

    <!-- 主内容包装器：隔离滚动内容与 Fixed 元素 -->
    <div id="app-content">
        <div id="clocksContainer"></div>
        <button id="addClockButton">+</button>
        <button id="resetButton">重置</button>

        <div id="footer">
            本程序由SimbaLee <a href="https://x.com/lipeng0820" target="_blank">@lipeng0820</a> 使用Claude3.5 Sonnet
            编写，欢迎分享使用，感谢Andrew McCluskey提供LED字体，<a href="https://github.com/lipeng0820/StudioClock/raw/main/Font.zip"
                target="_blank">点击下载字体</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
